<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width", initial-scale="1.0">
            <title>Lab 2.2 Part B</title>

</head>
<body>

    <h1>Part B: Formatting Web Page with <Table>

    <table border="1" width= "600" height="350" cellspacing="0" cellpadding="0">
        

        <!--Banner-->
        <tr>
            <td colspan="3" align="center" height="70">
            <h2>This is banner area</h2>
            </td>


        <!--Main Layout-->
        <tr>
            <!--Navigation-->
            <td width="120" valign="top">
                <b>Navigation</b>
                <p>Home</p>
                <p>About</p>
                <p>Contact</p>
            </td>


            <!--Spacer-->
            <td width="450" valign="top">
                <h2>Content</h2>
                <p>Page content goes here.</p>
                <p>
                    Welcome to my HTML Table Layout
                </p>
            </td>
        </tr>

        </table>
    </body>
</html>
