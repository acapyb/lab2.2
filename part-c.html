<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width", initial-scale="1.0">
            <title>Lab 2.2 Part C</title>
</head>
<body>


    <h1>LAB EXERCISE 2.1 - PART B</h1>


    <form action="#" method="get">

        <!-- Name -->
         <label for="name">Name:</label>
         <input type="text" id="name" name="name" required>
         <br><br>

         <label for="password">Password:</label>
         <input type="password" id="password" name="password">
            <br><br>


        <!-- Gender -->
         <label>Gender:</label>
         <br>
         <input type="radio" id="male" name="gender" value="Male">
         <label for="male">Male</label>
         <br>


         <input type="radio" id="female" name="gender" value="Female">
         <label for="female">Female</label>
         <br>

         <input type="radio" id="other" name="gender" value="Other">
         <label for="other">Other</label>


         <!--Age-->
         <label for="age">Age:</label>
         <select id="age" name="age"
         <option value="">Select Age</option>
            <option value="18-24">18-24</option>
            <option value="25-34">25-34</option>
            <option value="35-44">35-44</option>
            <option value="45+">45+</option>
        </select>
        <br><br>

        <!-- Interests -->
         <label for="interests">Interests:</label>
         <br>
         <textarea id="interests" name="interests" rows="4" cols="30">

         </textarea>
         <br><br>

         <!--Newsletter Subscription-->
         <label>Subscribe to Newsletter:</label>

         <input type="radio" id="yes" name="newsletter" value="Yes">
         <label for="yes">Yes</label>

         <input type="radio" id="no" name="newsletter" value="No">
         <label for="no">No</label>

         <input type="radio" id="not-interested" name="newsletter" value="Not Interested">
         <label for="not-interested">Not Interested</label>
         <br><br>


         <!--Submit-->
         <input type="submit" value="Submit">

         </form>


</body>
</html>
